services:
  - type: web
    name: bharatzero
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: AI_ANALYSIS_PROVIDER
        value: gemma
      - key: GEMMA_MODEL
        value: gemma-4-31b-it
      - key: GEMMA_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
